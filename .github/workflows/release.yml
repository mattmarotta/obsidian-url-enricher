name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required so git tag -l sees previous tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Guards against publishing a release Obsidian can never serve. Obsidian
      # reads manifest.json from the default branch to detect updates, so the
      # tag must match the manifest AND the tagged commit must be on master.
      - name: Verify tag matches manifest and is on master
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          if [ "${VERSION#v}" != "$VERSION" ]; then
            echo "::error::Tag '$VERSION' has a 'v' prefix. Tags must be bare (e.g. 1.2.3)," \
                 "otherwise the CHANGELOG lookup for '## [$VERSION]' finds nothing."
            exit 1
          fi

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::Tag '$VERSION' does not match manifest.json version '$MANIFEST_VERSION'."
            exit 1
          fi

          MIN_APP=$(node -p "require('./manifest.json').minAppVersion")
          MAPPED=$(node -p "require('./versions.json')['$VERSION'] || ''")
          if [ "$MAPPED" != "$MIN_APP" ]; then
            echo "::error::versions.json is missing or wrong for '$VERSION'" \
                 "(expected '$MIN_APP', got '${MAPPED:-<missing>}'). Run 'npm run set-version $VERSION'."
            exit 1
          fi

          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tagged commit is not on master. Merge the version bump first," \
                 "then tag from an up-to-date master - otherwise Obsidian will keep serving the old version."
            exit 1
          fi

          echo "✓ $VERSION matches manifest, versions.json, and is on master"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          
          # Extract the section for this version from CHANGELOG.md
          # This captures everything between ## [VERSION] and the next ## [
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "## \\[" ver "\\]") found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          
          if [ -z "$NOTES" ]; then
            echo "⚠️ No changelog entry found for version $VERSION"
            NOTES="No changelog entry found. See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          
          # Save to output (handle multiline)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Get previous tag for comparison link
          # Get all tags sorted by version, then get the one before current
          PREVIOUS_TAG=$(git tag -l --sort=-v:refname | awk -v ver="$VERSION" '
            $0 == ver {
              found=1
              next
            }
            found {
              print $0
              exit
            }
          ')
          if [ -z "$PREVIOUS_TAG" ]; then
            # No previous tag found, use first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREVIOUS_TAG }}...${{ steps.get_version.outputs.VERSION }}
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
